<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420"><rect width="100%" height="100%" rx="24" fill="#f8fafc"/><rect x="60" y="35" width="880" height="350" rx="20" fill="#fff" stroke="#cbd5e1"/><rect x="60" y="35" width="880" height="54" rx="20" fill="#f1f5f9" stroke="none"/><text x="92" y="70" font-family="sans-serif" font-size="19" font-weight="700" fill="#334155" text-anchor="start">MY WEBSITE</text><text x="650" y="70" font-family="sans-serif" font-size="16" font-weight="400" fill="#334155" text-anchor="start">首頁　關於我　聯繫我</text><rect x="60" y="89" width="880" height="296" rx="0" fill="#F2F5E9" stroke="none"/><text x="115" y="135" font-family="sans-serif" font-size="15" font-weight="700" fill="#386641" text-anchor="start">WELCOME TO MY WEBSITE</text><text x="115" y="195" font-family="sans-serif" font-size="38" font-weight="700" fill="#283D2B" text-anchor="start">歡迎來到我的網站</text><text x="115" y="240" font-family="sans-serif" font-size="25" font-weight="700" fill="#386641" text-anchor="start">關於我 About Me</text><text x="115" y="279" font-family="sans-serif" font-size="18" font-weight="400" fill="#283D2B" text-anchor="start">我是一名企管系大一學生，喜歡旅遊、攝影，</text><text x="115" y="307" font-family="sans-serif" font-size="18" font-weight="400" fill="#283D2B" text-anchor="start">也喜歡探索生活中的新事物。</text><rect x="115" y="328" width="130" height="40" rx="8" fill="#386641" stroke="none"/><text x="180" y="354" font-family="sans-serif" font-size="16" font-weight="400" fill="white" text-anchor="middle">了解更多</text><rect x="695" y="128" width="185" height="205" rx="16" fill="#A7C957" stroke="none"/><text x="788" y="232" font-family="sans-serif" font-size="19" font-weight="700" fill="#283D2B" text-anchor="middle">圖片區域</text></svg>